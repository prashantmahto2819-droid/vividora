# Vividora — one file runs everything on the Ubuntu VM.
#   cp .env.example .env   (fill it in)
#   docker compose up -d --build
services:
  api:
    build: ./server
    image: vividora/server
    restart: always
    env_file: .env
    environment:
      DATA_ROOT: /data
      MEDIA_ROOT: /media
      ARCHIVE_ROOT: /archive
    volumes:
      - ${DATA_DIR:-/srv/studio/data}:/data
      - ${MEDIA_DIR:-/srv/studio/media}:/media
      - ${ARCHIVE_DIR:-/srv/studio/archive}:/archive
      - ./web/dist:/app/web-dist:ro
      - ${RCLONE_CONFIG_DIR:-/home/prashant/.config/rclone}:/root/.config/rclone
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: vividora/server
    restart: always
    env_file: .env
    environment:
      API_URL: http://api:8000
      WORKER_NAME: cpu@docker
      # transcribe on the VM's CPU (no NVIDIA GPU needed). Models: small / medium / large-v3
      TRANSCRIBE_LOCAL: ${TRANSCRIBE_LOCAL:-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-medium}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      WHISPER_THREADS: ${WHISPER_THREADS:-12}
      WHISPER_CACHE: /models
      # optional LLM for Shorts titles/hooks, scripts, planner (leave empty = offline heuristics)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    command: ["python", "-m", "vividora.worker.cpu"]
    depends_on:
      api:
        condition: service_healthy
    # keep WhatsApp gateway / other containers responsive while rendering
    cpus: ${WORKER_CPUS:-12}
    mem_limit: ${WORKER_MEM:-16g}
    volumes:
      - worker-tmp:/tmp
      - whisper-models:/models

volumes:
  worker-tmp:
  whisper-models:

  # Cloudflare Tunnel — Vividora को https://studio.<domain> पर खोलता है (port forward नहीं चाहिए).
  # .env में CLOUDFLARE_TUNNEL_TOKEN डालें, फिर: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles: ["tunnel"]

