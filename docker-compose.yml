# Vividora — one file runs everything on the Ubuntu VM.
#   cp .env.example .env   (fill it in)
#   docker compose up -d --build
services:
  api:
    build: ./server
    image: vividora/server
    restart: always
    env_file: .env
    # TripoSR (:8090) and VoiceStudio (:3900) run on the VM itself, not in Docker — "127.0.0.1" inside the
    # container is the container, so reach the host through host.docker.internal (overrides .env on purpose)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRIPOSR_URL: http://host.docker.internal:8090
      VOICESTUDIO_URL: http://host.docker.internal:3901  # voicestudio-proxy.service: docker bridge IP:3901 -> 127.0.0.1:3900
      DATA_ROOT: /data
      MEDIA_ROOT: /media
      RAW_ROOT: /raw
      ARCHIVE_ROOT: /archive
    volumes:
      - ${DATA_DIR:-/srv/studio/data}:/data
      - ${MEDIA_DIR:-/srv/studio/media}:/media
      - ${ARCHIVE_DIR:-/srv/studio/archive}:/archive
      # big originals (uploads, library videos) — set RAW_DIR to the Windows D: drive share, see docs/storage-d-drive.md
      - ${RAW_DIR:-/srv/studio/raw}:/raw
      - ./web/dist:/app/web-dist:ro
      - ${RCLONE_CONFIG_DIR:-/home/prashant/.config/rclone}:/root/.config/rclone
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: vividora/server
    restart: always
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRIPOSR_URL: http://host.docker.internal:8090
      VOICESTUDIO_URL: http://host.docker.internal:3901
      API_URL: http://api:8000
      WORKER_NAME: cpu@docker
      # transcribe on the VM's CPU (no NVIDIA GPU needed). Models: small / medium / large-v3
      TRANSCRIBE_LOCAL: ${TRANSCRIBE_LOCAL:-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE: int8
      WHISPER_THREADS: ${WHISPER_THREADS:-12}
      WHISPER_CACHE: /models
      # optional LLM for Shorts titles/hooks, scripts, planner (leave empty = offline heuristics)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      # Cloud TTS — ElevenLabs (set ELEVENLABS_API_KEY in .env for cloud voices)
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_multilingual_v2}
      # Cloud TTS — Google Cloud (set GOOGLE_APPLICATION_CREDENTIALS path in .env)
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # all = every job kind (one worker does everything). With the "quick" profile below this one
      # takes only the long jobs and the quick worker the short steps.
      WORKER_LANE: ${WORKER_LANE:-all}
      SEGMENT_RENDER: ${SEGMENT_RENDER:-1}
      SEG_CACHE_GB: ${SEG_CACHE_GB:-20}
    command: ["python", "-m", "vividora.worker.cpu"]
    depends_on:
      api:
        condition: service_healthy
    # keep WhatsApp gateway / other containers responsive while rendering
    cpus: ${WORKER_CPUS:-12}
    mem_limit: ${WORKER_MEM:-16g}
    volumes:
      - worker-tmp:/tmp
      - whisper-models:/models

  # Quick lane (optional): a second, small worker for the short steps — prepare, cuts, plans, publish,
  # compress — so a new upload never waits behind a long render. Start with:
  #   WORKER_LANE=heavy docker compose --profile tunnel --profile quick up -d
  worker-quick:
    image: vividora/server
    restart: always
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TRIPOSR_URL: http://host.docker.internal:8090
      VOICESTUDIO_URL: http://host.docker.internal:3901
      API_URL: http://api:8000
      WORKER_NAME: quick@docker
      WORKER_LANE: quick
      TRANSCRIBE_LOCAL: "0"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    command: ["python", "-m", "vividora.worker.cpu"]
    depends_on:
      api:
        condition: service_healthy
    cpus: ${QUICK_WORKER_CPUS:-4}
    mem_limit: ${QUICK_WORKER_MEM:-6g}
    volumes:
      - worker-tmp:/tmp
    profiles: ["quick"]

  # Cloudflare Tunnel — Vividora को https://studio.<domain> पर खोलता है (port forward नहीं चाहिए).
  # .env में CLOUDFLARE_TUNNEL_TOKEN डालें, फिर: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api
    profiles: ["tunnel"]

volumes:
  worker-tmp:
  whisper-models:
